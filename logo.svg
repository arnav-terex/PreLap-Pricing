<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
    <defs>
        <!-- Laptop Shell Dark Gradient -->
        <linearGradient id="prelap-laptop-shell" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E3E62"/>
            <stop offset="100%" stop-color="#0B192C"/>
        </linearGradient>

        <!-- Base Edge Gradient -->
        <linearGradient id="prelap-laptop-base" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2C5382"/>
            <stop offset="100%" stop-color="#08121E"/>
        </linearGradient>

        <!-- Dynamic Bar Chart Gradient -->
        <linearGradient id="prelap-bar-gradient" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#05C46B"/>
            <stop offset="100%" stop-color="#00D8D6"/>
        </linearGradient>

        <!-- Glowing Prediction Arrow Gradient -->
        <linearGradient id="prelap-arrow-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#05C46B"/>
            <stop offset="50%" stop-color="#00D8D6"/>
            <stop offset="100%" stop-color="#48DBFB"/>
        </linearGradient>

        <!-- Glow Shadow Filter -->
        <filter id="prelap-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#00D8D6" flood-opacity="0.4"/>
        </filter>
    </defs>

    <g id="prelap-icon-mark">
        
        <!-- 1. LAPTOP SCREEN OUTER BEZEL -->
        <path d="M 190 85 L 315 95 C 322 95, 326 100, 325 107 L 310 245 C 309 251, 303 256, 296 255 L 165 242 C 158 241, 154 236, 155 229 L 175 100 C 176 92, 183 85, 190 85 Z" 
              fill="url(#prelap-laptop-shell)" 
              stroke="#2C5382" 
              stroke-width="3" />

        <!-- 2. LAPTOP INNER SCREEN DISPLAY -->
        <path d="M 194 94 L 309 103 C 313 103, 316 106, 315 111 L 302 236 C 302 240, 298 243, 293 242 L 172 231 C 168 231, 165 227, 166 223 L 182 102 C 183 97, 189 94, 194 94 Z" 
              fill="#060D17" />

        <!-- 3. BAR CHART ON SCREEN (VALUATION METRICS) -->
        <!-- Bar 1 -->
        <path d="M 188 220 L 206 222 L 208 200 L 190 198 Z" fill="url(#prelap-bar-gradient)" opacity="0.8" />
        <!-- Bar 2 -->
        <path d="M 214 222 L 232 224 L 236 170 L 218 168 Z" fill="url(#prelap-bar-gradient)" opacity="0.85" />
        <!-- Bar 3 -->
        <path d="M 240 225 L 258 227 L 264 145 L 246 143 Z" fill="url(#prelap-bar-gradient)" opacity="0.9" />
        <!-- Bar 4 -->
        <path d="M 266 227 L 284 229 L 292 120 L 274 118 Z" fill="url(#prelap-bar-gradient)" opacity="1.0" />

        <!-- 4. UPWARD PREDICTION TREND ARROW (BURSTING OUT) -->
        <path d="M 180 215 
                 L 225 155 
                 L 250 180 
                 L 308 90" 
              fill="none" 
              stroke="url(#prelap-arrow-gradient)" 
              stroke-width="12" 
              stroke-linecap="round" 
              stroke-linejoin="round" 
              filter="url(#prelap-glow)" />

        <!-- Arrow Head -->
        <path d="M 292 82 L 322 88 L 306 114 Z" 
              fill="#48DBFB" 
              filter="url(#prelap-glow)" />

        <!-- 5. LAPTOP KEYBOARD BASE -->
        <path d="M 112 255 L 348 276 C 356 277, 360 282, 355 289 L 310 325 C 304 330, 292 331, 281 330 L 122 315 C 111 314, 102 306, 104 298 L 110 262 C 110 257, 111 255, 112 255 Z" 
              fill="url(#prelap-laptop-base)" 
              stroke="#3B6291" 
              stroke-width="2" />

        <!-- Trackpad Accent -->
        <path d="M 188 300 L 245 305 L 241 318 L 185 313 Z" fill="#1E3E62" />

        <!-- 6. ATTACHED PRICE TAG BADGE (VALUATION & COMMERCE) -->
        <g transform="translate(305, 180) rotate(-18)" filter="url(#prelap-glow)">
            <!-- String connecting tag to laptop -->
            <path d="M 0 10 L -18 5" stroke="#2C5382" stroke-width="3" fill="none" />
            <!-- Tag Shell -->
            <path d="M 0 0 L 28 0 L 42 14 L 42 36 C 42 39, 39 42, 36 42 L 0 42 C -3 42, -6 39, -6 36 L -6 6 C -6 3, -3 0, 0 0 Z" 
                  fill="#0B192C" 
                  stroke="#00D8D6" 
                  stroke-width="3" />
            <!-- Hole Cutout -->
            <circle cx="6" cy="21" r="3.5" fill="#00D8D6" />
        </g>

    </g>
</svg>